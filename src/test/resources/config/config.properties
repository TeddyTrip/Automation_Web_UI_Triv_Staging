# Futures UI defaults
futures.default.symbol=BTCUSDT-PERP
futures.search.selector.type=name
futures.search.selector.value=search_markets_futures
futures.results.selector.type=css
futures.results.selector.value=tbody.all-markets-futures-tbody
futures.pair.selector.type=css
futures.pair.selector.template=a.change-market-futures-currency[data-selected-currency='%s']

# Spot Market UI final selectors (v1.4.1)
market.default.symbol=BTC_IDR
# Confirmed DOM:
# category container : ul#container-menu.market-categories
# category button    : button.category-nav[data-category='<category>']
# pair button        : button.pair-nav[data-category='<category>'][data-pair='<quote>']
# search             : input[name='search_market']
# results            : tbody.all-market-tbody
# exact pair         : td[data-symbol='<BASE_QUOTE>'] a.all-24hticker-yo[data-selected-currency='<BASE_QUOTE>']
market.ui.categories=crypto,stocks,oil,all
market.ui.pairs=IDR,USDT,BTC,ETH

market.search.result.timeout.seconds=6

market.search.poll.millis=100
